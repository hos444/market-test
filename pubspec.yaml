name: finall_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  iconsax: ^0.0.8
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.2
  flutter_native_splash: ^2.4.6
  carousel_slider: ^5.1.2
  curved_navigation_bar: ^1.0.6
  provider: ^6.0.5
  easy_localization: ^3.0.3

flutter_native_splash:
  color: "#ffffff"   
  image: assets/logo/Image.png 
  android: true
  ios: true
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/bannar/
    - assets/category/
    - assets/fruits/
    - assets/icons/
    - assets/logo/
    - assets/onbording/
    - assets/payments/
    - assets/translations/

